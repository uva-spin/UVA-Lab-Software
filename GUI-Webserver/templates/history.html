<!DOCTYPE html>

<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UVA Polarized Target Group Lab 042 System Panel</title>
    <link rel="icon" href="{{ url_for('static', filename='images/UVASpinLogo.png')}}">

    <!-- External Libraries -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flot@4.2.6/dist/es5/jquery.flot.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Import JavaScript modules -->
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chart.js') }}"></script>
    <script src="{{ url_for('static', filename='js/data.js') }}"></script>
    <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>


    <!-- Add CSS for warning message -->
    <style>
        .warning-message {
            background-color: var(--warning-bg, #fff3cd);
            color: var(--warning-text, #856404);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: slideIn 0.3s ease-out;
        }

        .warning-message i {
            color: var(--warning-icon, #856404);
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        [data-theme='dark'] .warning-message {
            background-color: var(--warning-bg-dark, #2c2a1c);
            color: var(--warning-text-dark, #ffd866);
        }
    </style>
</head>

<body>
    <!-- Header Banner -->
    <header class="header-banner">
        <div class="banner-content">
            <div class="banner-title">
                <span>UVA Polarized Target Group Lab 042 System Panel</span>
            </div>
            <div class="banner-controls">
                <!-- Date Range Selector -->
                <div class="control-group date-range-group">
                    <div class="date-input">
                        <label for="start-date">Start Date</label>
                        <input type="date" id="start-date" name="start-date">
                    </div>
                    <div class="date-input">
                        <label for="end-date">End Date</label>
                        <input type="date" id="end-date" name="end-date">
                    </div>
                    <button type="button" class="apply-btn" onclick="applyDateRangeSettings()">
                        <i class="fas fa-calendar-check"></i> Apply
                    </button>
                </div>
                <div class="status-info">
                    <p id="last-updated" class="last-updated">
                        <i class="fas fa-clock"></i> Last updated: --
                    </p>
                </div>
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
                    <i id="theme-icon" class="fas fa-moon"></i>
                </button>
                <div class="control-group-dropdown" id="control-dropdown">
                    <button class="control-group-dropdown-btn" onclick="toggleDropdown()" title="Dropdown Menu">
                        <i class="fas fa-ellipsis-v"></i>
                    </button>
                    <div class="control-group-dropdown-content" id="dropdown-content">
                        <button class="control-group-dropdown-item" onclick="shutdownServer()" title="Shutdown Server">
                            <i class="fas fa-power-off"></i>
                            <span>Shutdown Server</span>
                        </button>
                        <button class="control-group-dropdown-item" onclick="selectAllData()" title="Select All Data">
                            <i class="fas fa-check-double"></i>
                            <span>Select All Data</span>
                        </button>
                        <button class="control-group-dropdown-item" onclick="clearAllData()" title="Clear All Data">
                            <i class="fas fa-times"></i>
                            <span>Clear All Data</span>
                        </button>
                        <button class="control-group-dropdown-item" onclick="refreshData()" title="Refresh Data">
                            <i class="fas fa-sync-alt"></i>
                            <span>Refresh Data</span>
                        </button>
                    </div>
                </div>
                <div class="history-tab">
                    <a href="/" class="history-tab-link">Home</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Dimming Overlay -->
    <div class="dimming-overlay" id="dimming-overlay"></div>

    <!-- Main Content -->
    <main class="main-container">
        <!-- Chart Section -->
        <section class="chart-section">
            <div class="chart-header">
                <h2 id="chart-title">Select Data Entries</h2>
            </div>
            <div id="chart" class="chart-container"></div>
        </section>
    </main>

    <!-- Data Selection Sidebar -->
    <div class="data-sidebar" id="data-sidebar">
        <!-- Content will be populated by JavaScript -->
    </div>

    <!-- Sidebar Toggle Button -->
    <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle Data Selection">
        <i class="fas fa-database"></i>
    </button>

    <!-- Floating Action Button -->
    <div class="fab-container">
        <button class="fab" onclick="toggleFabMenu()" title="Quick Actions">
            <i class="fas fa-plus"></i>
        </button>
        <div class="fab-menu">
            <button class="fab-item" onclick="selectAllData()" title="Select All Data">
                <i class="fas fa-check-double"></i>
            </button>
            <button class="fab-item" onclick="clearAllData()" title="Clear All Data">
                <i class="fas fa-times"></i>
            </button>
            <button class="fab-item" onclick="refreshData()" title="Refresh Data">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

</body>

</html>
