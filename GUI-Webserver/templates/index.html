<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UVA Polarized Target Group Lab 036 System Panel</title>

    <!-- External Libraries -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flot@4.2.6/dist/es5/jquery.flot.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

    <script>
        // Global variables
        let hours = 1;
        let minutes = 0;
        let seconds = 0;
        let updateTime = 5;
        let remainingTime = null;
        let timerInterval = null;
        let selectedKeys = [];
        let isDarkMode = false;

        // Theme management
        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('theme-icon');
            const isDark = html.getAttribute('data-theme') === 'dark';
            
            if (isDark) {
                html.setAttribute('data-theme', 'light');
                themeIcon.className = 'fas fa-moon';
                isDarkMode = false;
            } else {
                html.setAttribute('data-theme', 'dark');
                themeIcon.className = 'fas fa-sun';
                isDarkMode = true;
            }
            
            updateChartTheme();
        }

        // Update chart theme based on current mode
        function updateChartTheme() {
            if (selectedKeys.length === 0) {
                updateEmptyChartDisplay();
            }
        }

        // Dynamic RGB gradient animation for empty chart
        function updateEmptyChartDisplay() {
            const chartContainer = document.getElementById('chart');
            chartContainer.innerHTML = `
                <div class="empty-chart-container">
                    <div class="gradient-text">
                        <span class="swirling-text">Select Data Entries</span>
                    </div>
                </div>
            `;
        }
        


        // Function to update the plot
        function updatePlot(data, selectedColumns) {
            const timestamps = data.map((_, index) => index + 1);

            const plotData = selectedColumns.map(column => ({
                label: column,
                data: timestamps.map((t, i) => [t, data[i][column]]),
                points: { show: true, radius: 3 },
                lines: { show: false }
            }));

            const options = {
                xaxis: {
                    axisLabel: 'Time',
                    axisLabelUseCanvas: true,
                    axisLabelFontSizePixels: 16,
                    axisLabelFontFamily: 'Inter, sans-serif',
                    color: isDarkMode ? '#ffffff' : '#333333',
                    tickColor: isDarkMode ? '#444444' : '#dddddd'
                },
                yaxis: {
                    axisLabel: 'Value',
                    axisLabelUseCanvas: true,
                    color: isDarkMode ? '#ffffff' : '#333333',
                    tickColor: isDarkMode ? '#444444' : '#dddddd'
                },
                legend: {
                    position: 'ne',
                    backgroundOpacity: 0,
                    labelBoxBorderColor: 'transparent',
                    show: true,
                    textColor: isDarkMode ? '#ffffff' : '#333333',
                    noColumns: 1,
                    margin: [10, 10]
                },
                grid: {
                    color: isDarkMode ? '#444444' : '#dddddd',
                    backgroundColor: isDarkMode ? '#1a1a1a' : '#ffffff'
                }
            };

            $('#chart').empty();
            if (selectedColumns.length > 0) {
                $.plot($('#chart'), plotData, options);
            } else {
                updateEmptyChartDisplay();
            }

            // Update chart title
            const titleElement = document.getElementById('chart-title');
            if (selectedColumns.length === 1) {
                titleElement.textContent = `${selectedColumns[0]} vs. Time`;
            } else if (selectedColumns.length === 0) {
                titleElement.textContent = 'No Data Selected';
            } else {
                titleElement.textContent = `Multiple Signals vs. Time`;
            }
        }

        async function fetchDataFromDB(selectedKeys) {
            const now = new Date();
            const totalMs = (hours * 3600 + minutes * 60 + seconds) * 1000;
            const start = new Date(now.getTime() - totalMs);

            const startTimeStr = start.toISOString().slice(0, 19).replace('T', ' ');
            const endTimeStr = now.toISOString().slice(0, 19).replace('T', ' ');

            const params = new URLSearchParams();
            params.append('keys', selectedKeys.join(','));
            params.append('start_time', startTimeStr);
            params.append('end_time', endTimeStr);
            
            try {
                const response = await fetch(`/query_db?${params.toString()}`);
                if (!response.ok) throw new Error('Failed to fetch data from server');

                const result = await response.json();
                return {
                    headers: result.columns,
                    data: result.data
                };
            } catch (err) {
                console.error('Error fetching from server:', err);
                return { headers: [], data: [] };
            }
        }

        async function updateFromDB() {
            const selectedKeys = Array.from(
                document.querySelectorAll('input[type="checkbox"]:checked')
            ).map(cb => cb.dataset.key);

            if (selectedKeys.length === 0) {
                updateEmptyChartDisplay();
                document.getElementById('chart-title').textContent = 'No Data Selected';
                return;
            }

            // Show loading state
            const chartContainer = document.getElementById('chart');
            chartContainer.innerHTML = `
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <p>Loading data...</p>
                </div>
            `;

            try {
            const { headers, data } = await fetchDataFromDB(selectedKeys);
            updatePlot(data, selectedKeys);
            } catch (error) {
                console.error('Error updating data:', error);
                chartContainer.innerHTML = `
                    <div class="error-container">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Error loading data. Please try again.</p>
                    </div>
                `;
            }
        }

        function refreshUpdatetime() {
            const display = document.getElementById('countdown');
            display.textContent = remainingTime;

            if (remainingTime > 0) {
                remainingTime--;
            } else {
                startCountdownFromServer();
            }
        }

        function updateLastUpdatedTime() {
            const now = new Date();
            const formatted = now.toLocaleString('en-US', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            document.getElementById('last-updated').textContent = `Last updated: ${formatted}`;
        }

        async function startCountdownFromServer() {
            remainingTime = updateTime;

            if (timerInterval) clearInterval(timerInterval);
            refreshUpdatetime();
            timerInterval = setInterval(refreshUpdatetime, 1000);

            await updateFromDB();
            updateLastUpdatedTime();
        }

        // Shutdown server function
        async function shutdownServer() {
            if (confirm('Are you sure you want to shutdown the server? This action cannot be undone.')) {
                const button = event.target.closest('button');
                const removeLoading = Utils.addLoadingState(button);
                
                try {
                    const response = await fetch('/shutdown', { method: 'POST' });
                    if (response.ok) {
                        Utils.showToast('Server shutdown initiated. The page will close shortly.', 'success');
                        setTimeout(() => {
                            window.close();
                        }, 2000);
                    } else {
                        Utils.showToast('Failed to shutdown server. Please try again.', 'error');
                    }
                } catch (error) {
                    console.error('Error shutting down server:', error);
                    Utils.showToast('Error shutting down server. Please check the console for details.', 'error');
                } finally {
                    removeLoading();
                }
            }
        }

        // Floating Action Button functions
        function toggleFabMenu() {
            const fabMenu = document.querySelector('.fab-menu');
            const fab = document.querySelector('.fab');
            fabMenu.classList.toggle('active');
            fab.classList.toggle('active');
        }

        function selectAllData() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = true;
            });
            handleCheckboxChange();
            Utils.showToast('All data entries selected!', 'success');
        }

        function clearAllData() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = false;
            });
            handleCheckboxChange();
            Utils.showToast('All data entries cleared!', 'info');
        }

        function refreshData() {
            updateFromDB();
            Utils.showToast('Data refreshed!', 'success');
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            startCountdownFromServer();
            updateEmptyChartDisplay();
        });
    </script>
</head>

<body>
    <!-- Header Banner -->
    <header class="header-banner">
        <div class="banner-content">
            <div class="banner-title">
                <!-- <i class="fas fa-atom"></i> -->
                <span>UVA Polarized Target Group Lab 036 System Panel</span>
            </div>
            <div class="banner-controls">
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
                    <i id="theme-icon" class="fas fa-moon"></i>
                </button>
                <button class="shutdown-btn" onclick="shutdownServer()" title="Shutdown Server">
                    <i class="fas fa-power-off"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <!-- Control Panel -->
        <section class="control-panel">
            <div class="panel-header">
                <h2><i class="fas fa-sliders-h"></i> Control Panel</h2>
        </div>

            <form id="refresh-form" class="control-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="hours">Hours</label>
                        <input type="number" id="hours" name="hours" min="0" max="24" value="1">
                    </div>
        <div class="form-group">
                        <label for="minutes">Minutes</label>
                        <input type="number" id="minutes" name="minutes" min="0" max="59" value="0">
        </div>
        <div class="form-group">
                        <label for="seconds">Seconds</label>
                        <input type="number" id="seconds" name="seconds" min="0" max="59" value="0">
        </div>
        <div class="form-group">
                        <label for="update_every">Update Interval (s)</label>
                        <input type="number" id="update_every" name="update_every" min="1" max="300" value="5">
                    </div>
                </div>
                <div class="form-row">
                    <button type="submit" class="submit-btn">
                        <i class="fas fa-sync-alt"></i> Apply Settings
                    </button>
                    <div class="countdown-display">
                        <span>Auto-update in: </span>
                        <span id="countdown" class="countdown-timer">5</span>
                        <span>s</span>
                    </div>
        </div>
    </form>

            <div class="status-info">
                <p id="last-updated" class="last-updated">
                    <i class="fas fa-clock"></i> Last updated: --
    </p>
            </div>
        </section>

        <!-- Chart Section -->
        <section class="chart-section">
            <div class="chart-header">
                <h2 id="chart-title">Select Data Entries</h2>
            </div>
            <div id="chart" class="chart-container"></div>
        </section>

        <!-- Data Selection Panel -->
        <section class="data-panel">
            <div class="panel-header">
                <h2><i class="fas fa-database"></i> Data Selection</h2>
            </div>
    <div class="grid-container" id="grid"></div>
        </section>
    </main>

    <!-- Floating Action Button -->
    <div class="fab-container">
        <button class="fab" onclick="toggleFabMenu()" title="Quick Actions">
            <i class="fas fa-plus"></i>
        </button>
        <div class="fab-menu">
            <button class="fab-item" onclick="selectAllData()" title="Select All Data">
                <i class="fas fa-check-double"></i>
            </button>
            <button class="fab-item" onclick="clearAllData()" title="Clear All Data">
                <i class="fas fa-times"></i>
            </button>
            <button class="fab-item" onclick="refreshData()" title="Refresh Data">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

    <script>
        // Form handling
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('refresh-form');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const submitBtn = form.querySelector('.submit-btn');
                const removeLoading = Utils.addLoadingState(submitBtn);

                try {
                hours = parseInt(document.getElementById('hours').value) || 0;
                minutes = parseInt(document.getElementById('minutes').value) || 0;
                seconds = parseInt(document.getElementById('seconds').value) || 0;
                updateTime = parseInt(document.getElementById('update_every').value) || 1;

                    await startCountdownFromServer();
                    Utils.showToast('Settings applied successfully!', 'success');
                } catch (error) {
                    console.error('Error applying settings:', error);
                    Utils.showToast('Error applying settings. Please try again.', 'error');
                } finally {
                    removeLoading();
                }
            });
        });

        // Populate parameters
        const titles = ['Lab QT', 'QT LiqQ', 'QT LiqB', 'QT Purifier', 'QT System', 'Cryo Pressure', 'Cryo Purity', 'Cryo Temperature'];
        const checkboxData = [
            ['fc501_ai', 'fc501_out', 'fc502_ai', 'fc502_out', 'lit501_ai', 'pt501_ai', 'pt502_ai', 'pt503_ai', 'pt504_ai', 'purity_downstream', 'purity_upstream', 'ait501_ai', 'ti501_ai', 'ti502_ai', 'ti503_ai', 'ti504_ai', 'ti505_ai', 'ti523_ai', 'r2_value', 'ch1', 'ch2', 'ch3'],
            ['PT501', 'PT502', 'PT503', 'PD', 'LI501', 'PT', 'TID', 'TI502', 'TI504', 'TI506', 'TI508', 'TI510', 'FC501Q', 'FC501I', 'FCQ', 'FCI', 'LakeShoreCurves_TIDAOHM'],
            ['PT501', 'PT502', 'PT503', 'PD', 'LI501', 'PT', 'TID', 'TI502', 'TI504', 'TI506', 'TI508', 'TI510', 'FC501Q', 'FC501I', 'FCQ', 'FCI', 'LakeShoreCurves_TIDBOHM'],
            ['T1A', 'Level A', 'PRTY_Calibrated', 'PRTY', 'PBA', 'PRTY_Calibrated_A_Out', 'PRTY_Calibrated_A_Mid', 'Flow Controller Flow', 'Vfc', 'DPfc', 'Pfc', 'T2Amv', 'T1Amv', 'T2A', 'PTA'],
            ['Manifolds PT8', 'Manifolds Magnet Dewar Level', 'Manifolds TCD_Smooth', 'Manifolds TX1', 'Manifolds FMR', 'Manifolds Magnet Dewar Pressure', 'Manifolds PC1', 'ODH EV-105-N', 'ODH TE-104N', 'ODH TE-107N', 'ODH TE-108N', 'ODH LL-106-N', 'ODH TE-109N', 'HR3 Enabled', 'ODH PT-106-N', 'ODH PT-110-N'],
            ['IVC T1F', 'IVC T2F', 'IVC T1T', 'IVC T2T', 'IVC', 'IVC T1', 'IVC T2', 'Fridge/1000', 'Fridge/100', 'He3 Probe', 'Return Manifold', 'Main Return #1', 'Roots-Pump Top', 'Roots-Pump Middle', 'Separator Return', 'Magnet Return', 'Main Return #2', 'n/c', 'Outside gHe Tank', 'HR3 Inlet', 'PTMR3'],
            ['He Purity'],
            ['Fridge/1000', 'Fridge/100', 'Fridge/He3', 'Tank T', 'Tank B', 'Coil T', 'Coil B', 'Coil T1', 'Coil T2', 'Coil T3', 'Coil T4', 'Coil B1', 'Coil B2', 'Coil B3', 'Coil B4', 'IVC Side Bottom', 'IVC Side Top', 'Fridge Top', 'LHe FL Stinger', 'LHe FL #1', 'LHe FL #2', 'Cooldown Line TX3', 'Cooldown Line TX2', 'Annealling A', 'Annealing B', 'Microwave A', 'Microwave B', 'He Riser', 'IVC Top', 'Heat Tape on IVC', 'Heat Tape on Turret', 'Baffle Top', 'Baffle Bottom', 'Separator Top', 'Separator Bottom', 'Heat-Ex Top', 'Heat-Ex Bottom', 'Ann-Plate Bar', 'Ann-Plate Top', 'Insert 1', 'Insert 2', 'Insert 3', 'Insert 4', 'Insert 5', 'Insert 6', 'Insert 7', 'Insert 8', 'Cernox 7', 'Cernox 8', 'Outside gHe Tank B', 'Outside gHe Tank R', 'Outside gHe Tank T', 'Outside gHe Tank L', 'Outside gHe Tank', 'LJT4']
        ];

        const grid = document.getElementById('grid');

        titles.forEach((title, index) => {
            const section = document.createElement('div');
            section.className = 'data-section';

            const titleDiv = document.createElement('div');
            titleDiv.className = 'section-title';
            titleDiv.innerHTML = `<i class="fas fa-layer-group"></i> ${title}`;
            section.appendChild(titleDiv);

            const checkboxes = checkboxData[index] || [];
            const checkboxContainer = document.createElement('div');
            checkboxContainer.className = 'checkbox-container';

            checkboxes.forEach(labelText => {
                const group = document.createElement('div');
                group.className = 'checkbox-group';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                const id = `${title}-${labelText}`.toLowerCase().replace(/\s+/g, '-');
                checkbox.id = id;
                checkbox.dataset.key = labelText.toLowerCase().replace(/\s+/g, '_');

                const label = document.createElement('label');
                label.htmlFor = id;
                label.textContent = labelText;

                group.appendChild(checkbox);
                group.appendChild(label);
                checkboxContainer.appendChild(group);
            });

            section.appendChild(checkboxContainer);
            grid.appendChild(section);
        });

        // Checkbox change handler
        async function handleCheckboxChange() {
            selectedKeys = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
                .map(cb => cb.dataset.key);

            if (selectedKeys.length === 0) {
                updateEmptyChartDisplay();
                document.getElementById('chart-title').textContent = 'Select Data Entries';
                return;
            }

            const { data: dbData } = await fetchDataFromDB(selectedKeys);
            updatePlot(dbData, selectedKeys);
        }

        // Setup checkbox event listeners
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', handleCheckboxChange);
        });
    </script>
</body>

</html>
